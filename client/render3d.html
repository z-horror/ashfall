<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Ashfall — Three.js building PoC</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(12, 15, 13, 0.86);
        --border: rgba(140, 126, 96, 0.55);
        --text: #d8d2c2;
        --accent: #c9a45c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #080b09; }
      body { font-family: "Consolas", "SFMono-Regular", monospace; color: var(--text); }
      #poc-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #poc-ui {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 290px;
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        backdrop-filter: blur(4px);
        font-size: 12px;
        line-height: 1.45;
        z-index: 10;
      }
      #poc-ui h1 { margin: 0 0 8px; font-size: 14px; color: var(--accent); letter-spacing: 0.04em; }
      #poc-ui p { margin: 0 0 10px; color: #9f9a8c; }
      .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
      button {
        flex: 1 1 auto;
        padding: 6px 8px;
        color: var(--text);
        background: rgba(42, 46, 40, 0.9);
        border: 1px solid var(--border);
        border-radius: 5px;
        cursor: pointer;
        font: inherit;
      }
      button:hover, button.active { border-color: var(--accent); color: var(--accent); }
      label { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer; }
      #poc-status { margin-top: 10px; color: #8f8a7d; min-height: 1.4em; }
      #poc-ready { color: #8fae7e; }
    </style>
  </head>
  <body>
    <canvas id="poc-canvas"></canvas>
    <div id="poc-ui">
      <h1>THREE.JS BUILDING POC</h1>
      <p>Тестовый дом 28..40 / 28..37. Ортокамера, z-buffer, реальные проёмы и шахты.</p>
      <p>ЛКМ — вращать камеру, колесо — зум.</p>
      <div class="btn-row">
        <button data-view="exterior" class="active">Экстерьер</button>
        <button data-view="terrace">Терраса</button>
        <button data-view="interior">Интерьер</button>
        <button data-view="animation">Анимация</button>
        <button data-view="door">Дверь</button>
        <button data-view="layers">Слои</button>
        <button data-view="variant">Вариант</button>
      </div>
      <label><input id="cutaway" type="checkbox" /> Cutaway (скрыть ближние стены и верх)</label>
      <label><input id="animate" type="checkbox" checked /> Walk-анимация персонажей</label>
      <div id="poc-status">Загрузка текстур...</div>
      <div id="poc-ready"></div>
    </div>
    <script type="module" src="/src/render3d/poc.ts"></script>
  </body>
</html>
