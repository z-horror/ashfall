<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>ASHFALL — M3 Ground Proof (3D-Земля)</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(14, 18, 16, 0.92);
        --border: rgba(138, 126, 99, 0.45);
        --text: #d6d0c0;
        --accent: #caa55e;
        --val: #9ad484;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #080b09; }
      body { font-family: "Consolas", "SFMono-Regular", monospace; color: var(--text); }
      #ground-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud-card {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 320px;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
        font-size: 12px;
        line-height: 1.45;
        z-index: 10;
        backdrop-filter: blur(6px);
      }
      #hud-card h1 {
        margin: 0 0 4px;
        font-size: 14px;
        color: var(--accent);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      #hud-card .subtitle {
        margin: 0 0 12px;
        font-size: 11px;
        color: #8c897f;
      }
      .metrics-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        margin-bottom: 12px;
      }
      .metric-item { display: flex; flex-direction: column; }
      .metric-label { font-size: 10px; color: #8e8b82; text-transform: uppercase; }
      .metric-val { font-size: 15px; font-weight: bold; color: var(--val); }
      .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 10px;
      }
      button {
        padding: 6px 8px;
        color: var(--text);
        background: rgba(38, 43, 38, 0.9);
        border: 1px solid var(--border);
        border-radius: 5px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        transition: border-color 0.15s, background-color 0.15s;
      }
      button:hover { border-color: var(--accent); background: rgba(55, 62, 54, 0.9); }
      label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; font-size: 11.5px; }
      input[type="checkbox"] { cursor: pointer; accent-color: var(--accent); }
      .hint { font-size: 10.5px; color: #7f7b70; margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 8px; }
      #proof-status { margin-top: 6px; font-size: 11px; color: var(--accent); min-height: 1.4em; }
    </style>
  </head>
  <body>
    <canvas id="ground-canvas"></canvas>

    <div id="hud-card">
      <h1>ASHFALL — M3 GROUND PROOF</h1>
      <div class="subtitle">3D-земля на участке 32×32 (тайлы 18..50)</div>

      <div class="metrics-grid">
        <div class="metric-item">
          <span class="metric-label">FPS</span>
          <span id="val-fps" class="metric-val">--</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Frame Time</span>
          <span id="val-frametime" class="metric-val">--</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Draw Calls</span>
          <span id="val-drawcalls" class="metric-val">--</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Triangles</span>
          <span id="val-triangles" class="metric-val">--</span>
        </div>
      </div>

      <div class="btn-grid">
        <button data-preset="isometric">Изометрия</button>
        <button data-preset="top">Top-Down</button>
        <button data-preset="basement">Подвал / Шахта</button>
        <button data-preset="south">Южный фасад</button>
        <button data-preset="north">Северный фасад</button>
        <button data-preset="east">Восточный фасад</button>
      </div>

      <label><input type="checkbox" id="chk-cutaway" /> Cutaway (скрыть этажи / ближние стены)</label>
      <label><input type="checkbox" id="chk-shadows" checked /> Динамические тени солнца</label>

      <div class="hint">ЛКМ — вращение камеры, Колесо — зум.</div>
      <div id="proof-status">Инициализация 3D-сцены...</div>
    </div>

    <script type="module" src="/src/render3d/ground3dProof.ts"></script>
  </body>
</html>
